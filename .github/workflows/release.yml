name: Build & Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Windows x64 (AMD64)
  # ============================================================================
  build-windows:
    name: Windows x64 (AMD64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Compile Windows Onefile Executable
        shell: powershell
        run: |
          .\build_windows.ps1

      - name: Prepare Windows Release Artifacts
        shell: bash
        run: |
          mkdir -p staging
          cp dist/Vaultables.exe staging/Vaultables-Windows-x64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vaultables-Windows-x64
          path: staging/Vaultables-Windows-x64.exe

  # ============================================================================
  # 2. Linux x64 (AMD64)
  # ============================================================================
  build-linux:
    name: Linux x64 (AMD64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install 7-Zip CLI & build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full binutils

      - name: Compile Linux Onefile Binary
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Prepare Linux Release Artifacts
        run: |
          mkdir -p staging
          cp dist/Vaultables staging/Vaultables-Linux-x64
          chmod +x staging/Vaultables-Linux-x64
          cd staging
          tar -czvf Vaultables-Linux-x64.tar.gz Vaultables-Linux-x64
          cd ..

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vaultables-Linux-x64
          path: |
            staging/Vaultables-Linux-x64
            staging/Vaultables-Linux-x64.tar.gz

  # ============================================================================
  # 3. macOS Apple Silicon (ARM64)
  # ============================================================================
  build-macos-arm64:
    name: macOS Apple Silicon (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install 7-Zip CLI
        run: |
          brew install sevenzip

      - name: Compile macOS ARM64 Distribution
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Package macOS ARM64 Artifacts
        run: |
          mkdir -p staging
          cp dist/Vaultables staging/Vaultables-macOS-arm64
          chmod +x staging/Vaultables-macOS-arm64
          ditto -c -k --sequesterRsrc --keepParent dist/Vaultables.app staging/Vaultables-macOS-arm64.app.zip

      - name: Upload macOS ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vaultables-macOS-arm64
          path: |
            staging/Vaultables-macOS-arm64
            staging/Vaultables-macOS-arm64.app.zip

  # ============================================================================
  # 4. macOS Intel (x86_64 / AMD64)
  # ============================================================================
  build-macos-x64:
    name: macOS Intel (x86_64)
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install 7-Zip CLI
        run: |
          brew install sevenzip

      - name: Compile macOS Intel Distribution
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Package macOS Intel Artifacts
        run: |
          mkdir -p staging
          cp dist/Vaultables staging/Vaultables-macOS-x86_64
          chmod +x staging/Vaultables-macOS-x86_64
          ditto -c -k --sequesterRsrc --keepParent dist/Vaultables.app staging/Vaultables-macOS-x86_64.app.zip

      - name: Upload macOS Intel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vaultables-macOS-x86_64
          path: |
            staging/Vaultables-macOS-x86_64
            staging/Vaultables-macOS-x86_64.app.zip

  # ============================================================================
  # 5. Publish Multi-Platform GitHub Release
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Consolidate Artifacts & Compute Checksums
        run: |
          mkdir -p release_assets
          find downloaded_artifacts -type f -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          files: |
            release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
